[package]
name = "aws-masquerade"
description = "AWS AssumeRole CLI tool with TOTP-based MFA support and flexible credential output"
version = "0.3.1"
authors = ["sinofseven <em.s.00001@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

repository = "https://github.com/sinofseven/aws-masquerade"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["aws", "assume_role", "credentials"]

[[bin]]
name = "aws-masquerade"
path = "src/main.rs"

[dependencies]
clap = {version = "4.6.1", features=["cargo", "derive"]}
data-encoding = "2.11.0"
serde = {version = "1.0.228", features=["derive"]}
dirs = "6.0.0"
serde_json = "1.0.149"
toml = "1.1.2"
colored = "3.1.1"
tokio = {version = "1.52.3", features=["full"]}
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-types = "1"
aws-sdk-sts = "1"
ring = "0.17.14"
uuid = {version = "1.23.1", features=["v4"]}
serde_ini = "0.2.0"
chrono = "0.4.44"
